      - btnExport:
          Control: Classic/Button
          Properties:
            X: |-
              =szCardX + 300
            Y: |-
              =544
            Width: |-
              =280
            Height: |-
              =52
            Text: |-
              ="Generate export"
            Fill: |-
              =clrViolet
            HoverFill: |-
              =clrVioletDeep
            PressedFill: |-
              =clrVioletDeep
            DisabledFill: |-
              =RGBA(226, 232, 240, 1)
            DisabledColor: |-
              =RGBA(148, 163, 184, 1)
            Color: |-
              =RGBA(255, 255, 255, 1)
            BorderThickness: |-
              =0
            Size: |-
              =13
            FontWeight: |-
              =FontWeight.Semibold
            DisplayMode: |-
              =If(
                  IsMatch(
                      TrimEnds(txtUrl.Text),
                      "^https://[\w-]+\.sharepoint\.com(/(sites|teams)/[^/\s]+)?/?$"
                  ) And (chkOwners.Value Or chkMembers.Value Or chkVisitors.Value)
                    And varState <> "busy",
                  DisplayMode.Edit,
                  DisplayMode.Disabled
              )
            OnSelect: |-
              =Set(varState, "busy");
               Set(varError, "");
               Set(varStep, 1);
               Clear(colAll);
               Set(
                   varGroups,
                   Concat(
                       Filter(
                           Table(
                               { Name: "Owners", On: chkOwners.Value },
                               { Name: "Members", On: chkMembers.Value },
                               { Name: "Visitors", On: chkVisitors.Value }
                           ),
                           On
                       ),
                       Name,
                       ","
                   )
               );
               IfError(
                   Set(
                       varRes,
                       GetSiteGroupsApp.Run(TrimEnds(txtUrl.Text), User().Email, varGroups)
                   ),
                   Set(varRes, Blank())
               );
               If(
                   IsBlank(varRes) Or varRes.status <> "Success",
                   Set(
                       varError,
                       If(
                           IsBlank(varRes),
                           "The request did not finish. Try again in a moment.",
                           varRes.message
                       )
                   );
                   Set(varState, "error"),
                   With(
                       { p: ParseJSON(varRes.payload) },
                       Set(varSiteTitle, Text(p.siteTitle));
                       Set(varOwnersGroup, Text(p.ownersGroup));
                       Set(varMembersGroup, Text(p.membersGroup));
                       Set(varVisitorsGroup, Text(p.visitorsGroup));
                       Set(varFileUrl, Text(varRes.fileUrl));
                       ForAll(
                           p.owners As o,
                           Collect(
                               colAll,
                               {
                                   Group: "Site Owners",
                                   Title: Text(o.Title),
                                   Email: Text(o.Email),
                                   Role: Text(p.ownersRole),
                                   MemberType: Switch(
                                       Value(o.PrincipalType),
                                       1, "User",
                                       2, "Distribution List",
                                       4, "Security Group",
                                       8, "SharePoint Group",
                                       "Other"
                                   )
                               }
                           )
                       );
                       ForAll(
                           p.members As m,
                           Collect(
                               colAll,
                               {
                                   Group: "Site Members",
                                   Title: Text(m.Title),
                                   Email: Text(m.Email),
                                   Role: Text(p.membersRole),
                                   MemberType: Switch(
                                       Value(m.PrincipalType),
                                       1, "User",
                                       2, "Distribution List",
                                       4, "Security Group",
                                       8, "SharePoint Group",
                                       "Other"
                                   )
                               }
                           )
                       );
                       ForAll(
                           p.visitors As v,
                           Collect(
                               colAll,
                               {
                                   Group: "Site Visitors",
                                   Title: Text(v.Title),
                                   Email: Text(v.Email),
                                   Role: Text(p.visitorsRole),
                                   MemberType: Switch(
                                       Value(v.PrincipalType),
                                       1, "User",
                                       2, "Distribution List",
                                       4, "Security Group",
                                       8, "SharePoint Group",
                                       "Other"
                                   )
                               }
                           )
                       )
                   );
                   If(
                       CountRows(colAll) = 0,
                       Set(varError, "Those groups exist but have no users in them.");
                       Set(varState, "error"),
                       Set(varState, "success")
                   )
               )
